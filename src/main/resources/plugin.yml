name: MiraBoosters
version: ${version}
main: com.mira.boosters.MiraBoostersPlugin
api-version: '1.21'
authors: [FiveS]
description: Timed global and personal multipliers for the Mira plugin ecosystem.
depend: [MiraCore]
softdepend: [PlaceholderAPI, MiraShop, MiraCrates, MiraSpawners]

commands:
  booster:
    description: View and administer MiraBoosters.
    usage: /booster <list|give|global|clear>
    aliases: [boosters]

permissions:
  miraboosters.use:
    default: true
  miraboosters.admin:
    default: op
